<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hex/Rounded -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Shield Outline -->
  <path d="M 64 16 L 102 32 C 102 70, 64 106, 64 112 C 64 106, 26 70, 26 32 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        filter="url(#cyanGlow)" />

  <!-- Padlock Shackle -->
  <path d="M 52 56 V 46 C 52 39, 76 39, 76 46 V 56" 
        fill="none" 
        stroke="#67e8f9" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="44" y="56" width="40" height="32" rx="6" fill="url(#shieldGrad)"/>

  <!-- Keyhole -->
  <circle cx="64" cy="69" r="4" fill="#0f172a" />
  <polygon points="61,71 67,71 65,80 63,80" fill="#0f172a" />
</svg>
